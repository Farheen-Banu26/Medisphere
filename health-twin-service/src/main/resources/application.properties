spring.application.name=health-twin-service

# ===========================
# Config Server
# ===========================
spring.config.import=optional:configserver:http://localhost:8888

# ===========================
# Server
# ===========================
server.port=8990

# ===========================
# MongoDB
# ===========================
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=test

# ===========================
# Eureka
# ===========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ===========================
# Kafka
# ===========================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=health-twin-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Deserialize JSON into VitalMessage
spring.kafka.consumer.properties.spring.json.value.default.type=com.infosys.health_twin_service.dto.VitalMessage

# Trust package for JSON deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=com.infosys.health_twin_service.dto

# ===========================
# Logging
# ===========================
logging.level.org.springframework.boot.autoconfigure.mongo=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.kafka=INFO