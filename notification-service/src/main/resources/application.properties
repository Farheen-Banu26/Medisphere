spring.application.name=notification-service

spring.config.import=optional:configserver:http://localhost:8888

server.port=9003

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=notificationdb

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.medisphere.notification_service.dto.AlertEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.medisphere.notification_service.dto,com.medisphere.alert_service.dto

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.data.mongodb=DEBUG

medisphere.alert-service.base-url=http://localhost:9002
medisphere.patient-service.base-url=http://localhost:8081

# Spring Mail Configuration
spring.mail.host=${SMTP_HOST:smtp.example.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:user}
spring.mail.password=${SMTP_PASSWORD:pass}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:true}
medisphere.mail.from=${MAIL_FROM:noreply@medisphere.com}
