spring.application.name=fhir-service

spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.request-connect-timeout=2000
spring.cloud.config.request-read-timeout=3000
spring.cloud.config.fail-fast=false

server.port=8993

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=fhirdb

fhir.server.url=https://hapi.fhir.org/baseR4
patient.service.url=http://localhost:8989

# Connection/read timeout values for FHIR client
spring.webflux.timeout.connection=10000
spring.webflux.timeout.read=10000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

logging.level.org.springframework.data.mongodb=DEBUG