spring.application.name=alert-service

spring.config.import=optional:configserver:http://localhost:8888

server.port=9002

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=alertsdb

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=alert-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.medisphere.alert_service.dto.VitalMessage
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.data.mongodb=DEBUG

patient.service.base-url=http://localhost:8081
healthtwin.service.base-url=http://localhost:8083
flask.service.base-url=http://localhost:5000
service.call.timeout=5000
