
spring.application.name=api-gateway

spring.config.import=optional:configserver:http://localhost:8888


server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Enable service discovery for routes
spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true
spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true

# -----------------------------
# Patient Service
# -----------------------------
spring.cloud.gateway.server.webmvc.routes[0].id=patient-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://PATIENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/patients/**

# -----------------------------
# Health Twin Service
# -----------------------------
spring.cloud.gateway.server.webmvc.routes[1].id=health-twin-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://HEALTH-TWIN-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/twins/**

# -----------------------------
# Consent Service
# -----------------------------
spring.cloud.gateway.server.webmvc.routes[2].id=consent-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://CONSENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/consents/**

# -----------------------------
# Vitals Service
# -----------------------------
spring.cloud.gateway.server.webmvc.routes[3].id=vitals-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://VITALS-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/vitals/**

# -----------------------------
# FHIR Service
# -----------------------------
spring.cloud.gateway.server.webmvc.routes[4].id=fhir-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://FHIR-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/fhir/**

# -----------------------------
# Audit Service
# -----------------------------
spring.cloud.gateway.server.webmvc.routes[5].id=audit-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://AUDIT-SERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/audit/**

# -----------------------------
# Prediction Service
# -----------------------------
spring.cloud.gateway.server.webmvc.routes[6].id=prediction-service
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://prediction-service
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/predictions/**

# -----------------------------
# Laboratory Service
# -----------------------------
spring.cloud.gateway.server.webmvc.routes[7].id=laboratory-service
spring.cloud.gateway.server.webmvc.routes[7].uri=lb://health-twin-service
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/labs/**

# ==========================================
# Keycloak OAuth2 JWT Configuration
# ==========================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/medisphere

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/medisphere/protocol/openid-connect/certs

