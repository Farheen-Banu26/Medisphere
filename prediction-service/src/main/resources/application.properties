####################################################
# APPLICATION
####################################################

spring.application.name=prediction-service
server.port=8986

####################################################
# CONFIG SERVER
####################################################

spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.request-connect-timeout=2000
spring.cloud.config.request-read-timeout=3000

####################################################
# EUREKA CLIENT
####################################################

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

####################################################
# MONGODB
####################################################

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=predictiondb

####################################################
# EXTERNAL SERVICES
####################################################

patient.service.base-url=http://localhost:8989
healthtwin.service.base-url=http://localhost:8990
flask.service.base-url=http://localhost:5000

####################################################
# SERVICE TIMEOUT
####################################################

service.call.timeout=5000

####################################################
# LOGGING
####################################################

logging.level.root=INFO
logging.level.com.medisphere=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=INFO

####################################################
# ACTUATOR
####################################################

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

####################################################
# JACKSON
####################################################

spring.jackson.serialization.indent-output=true